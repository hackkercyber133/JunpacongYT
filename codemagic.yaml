workflows:
  android-debug:
    name: Junpacong APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Siapkan scaffold Android (gradle, dll) tanpa menimpa file sendiri
        script: |
          flutter create /tmp/scaffold --org com.mady --project-name junpacong --platforms=android
          mkdir -p android
          (cd /tmp/scaffold/android && find . -type f) | while read -r f; do
            if [ ! -e "android/$f" ]; then
              mkdir -p "android/$(dirname "$f")"
              cp "/tmp/scaffold/android/$f" "android/$f"
            fi
          done
          chmod +x android/gradlew || true
      - name: Ambil package
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
